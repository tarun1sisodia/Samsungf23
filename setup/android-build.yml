# =============================================================================
# Cat Parallax Wallpaper — CI build
#
# ONE-TIME SETUP (the sandbox agent's GitHub token isn't allowed to create
# workflow files, so this needs a 60-second manual paste):
#
#   1. Open: https://github.com/tarun1sisodia/Samsungf23/new/main
#      ?filename=.github/workflows/android-build.yml
#      (or: repo → Add file → Create new file, on the main branch)
#   2. Name it: .github/workflows/android-build.yml
#   3. Paste this entire file, commit.
#
# After that this workflow runs automatically:
#   - on every push to main            -> builds + publishes a Release APK
#   - on every pull-request update     -> builds (APK as run artifact)
#   - manually (Actions tab, Run)      -> builds
# =============================================================================
name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Assemble signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v3

      - name: Build release APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cat-parallax-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Report build errors on the PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## ❌ APK build failed"
            echo
            echo '```'
            grep -E "^e: |error: |FAILURE: Build failed|Caused by:|Execution failed for task" build.log | head -n 80 || true
            echo '```'
            echo "Full log: run #${{ github.run_number }}"
          } > comment.md
          gh pr comment "$PR_NUMBER" --body-file comment.md || true

      - name: Publish release (pushes to main)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')"
          TAG="v${VERSION}-${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/release/*.apk \
            --title "Cat Parallax Wallpaper $TAG" \
            --notes "Automatic build from commit ${{ github.sha }}.

          **Install on the F23:** download the .apk below, open it, allow the install (unknown sources), then set it as your home screen live wallpaper — Settings → Wallpaper and style → Change wallpapers → ⋮ → Live wallpapers → Cat Parallax." \
            --latest
